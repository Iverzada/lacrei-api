name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lacrei_test
          POSTGRES_USER: lacrei
          POSTGRES_PASSWORD: lacrei_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lacrei -d lacrei_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: lacrei_test
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: lacrei_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check .

      - name: Django check
        run: poetry run python manage.py check

      - name: Tests with coverage
        run: poetry run coverage run --source=professionals,appointments manage.py test

      - name: Coverage minimum
        run: poetry run coverage report --fail-under=90

      - name: Docker build
        run: docker build -t lacrei-api .