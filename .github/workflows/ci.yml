name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lacrei_test
          POSTGRES_USER: lacrei
          POSTGRES_PASSWORD: lacrei_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lacrei -d lacrei_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: lacrei_test
      POSTGRES_USER: lacrei
      POSTGRES_PASSWORD: lacrei_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Lint
        run: poetry run ruff check .

      - name: Django check
        run: poetry run python manage.py check

      - name: Tests with coverage
        run: poetry run coverage run --source=professionals,appointments manage.py test

      - name: Coverage minimum
        run: poetry run coverage report --fail-under=90

      - name: Docker build
        run: docker build -t lacrei-api .

  deploy-staging:
    name: Deploy staging
    needs: lint-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_REGION: us-east-2
      EB_APPLICATION: lacrei-api
      EB_STAGING_ENVIRONMENT: lacrei-amb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy to staging
        shell: bash
        run: |
          set -euo pipefail

          VERSION_LABEL="github-${GITHUB_SHA}"

          git archive --format=zip --output=deploy.zip HEAD

          BUCKET="$(aws elasticbeanstalk create-storage-location --query 'S3Bucket' --output text)"
          S3_KEY="lacrei-api/${VERSION_LABEL}.zip"

          aws s3 cp deploy.zip "s3://${BUCKET}/${S3_KEY}"

          VERSION_EXISTS="$(aws elasticbeanstalk describe-application-versions \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --query 'length(ApplicationVersions)' \
            --output text)"

          if [ "$VERSION_EXISTS" = "0" ]; then
            aws elasticbeanstalk create-application-version \
              --application-name "$EB_APPLICATION" \
              --version-label "$VERSION_LABEL" \
              --source-bundle S3Bucket="$BUCKET",S3Key="$S3_KEY"
          fi

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_STAGING_ENVIRONMENT" \
            --version-label "$VERSION_LABEL"

          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_STAGING_ENVIRONMENT"

          DEPLOYED_VERSION="$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_STAGING_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' \
            --output text)"

          if [ "$DEPLOYED_VERSION" != "$VERSION_LABEL" ]; then
            echo "Staging deployment failed."
            exit 1
          fi

          echo "Staging deployed successfully: $VERSION_LABEL"

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
      AWS_REGION: us-east-2
      EB_PRODUCTION_APPLICATION: lacrei-prod
      EB_PRODUCTION_ENVIRONMENT: lacrei-prod

    steps:
      - name: Deploy to production
        shell: bash
        run: |
          set -euo pipefail

          VERSION_LABEL="github-${GITHUB_SHA}"

          BUCKET="$(aws elasticbeanstalk create-storage-location --query 'S3Bucket' --output text)"
          S3_KEY="lacrei-api/${VERSION_LABEL}.zip"

          VERSION_EXISTS="$(aws elasticbeanstalk describe-application-versions \
            --application-name "$EB_PRODUCTION_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --query 'length(ApplicationVersions)' \
            --output text)"

          if [ "$VERSION_EXISTS" = "0" ]; then
            aws elasticbeanstalk create-application-version \
              --application-name "$EB_PRODUCTION_APPLICATION" \
              --version-label "$VERSION_LABEL" \
              --source-bundle S3Bucket="$BUCKET",S3Key="$S3_KEY"
          fi

          aws elasticbeanstalk update-environment \
            --environment-name "$EB_PRODUCTION_ENVIRONMENT" \
            --version-label "$VERSION_LABEL"

          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_PRODUCTION_ENVIRONMENT"

          DEPLOYED_VERSION="$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_PRODUCTION_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' \
            --output text)"

          if [ "$DEPLOYED_VERSION" != "$VERSION_LABEL" ]; then
            echo "Production deployment failed."
            exit 1
          fi

          echo "Production deployed successfully: $VERSION_LABEL"